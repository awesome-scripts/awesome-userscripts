name: Validate links on push + PR

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Validate links
        uses: lycheeverse/lychee-action@e825bd0ff6d01b38b575eb2182b6a4f27ff9c08c # v2.9.0
        with:
          args: >-
            "*.md" "**/*.md"
            --verbose --no-progress --include-mail
            --include-fragments --index-files README.md --exclude "#readme"
            --accept 200..299,300..399,403,429
            --cache --max-cache-age 3d
            --exclude api\.star-history\.com --exclude browser\.qq\.com --exclude ghostbrowser\.com --exclude openuserjs\.org --exclude stargazers
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Save lychee cache
        uses: actions/cache/save@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
